<title>自強大樓教室課表</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 校徽＋標題頁首 → 分頁列 → 各分頁內容；固定深色主題，配色取自校徽（深藍底、金色強調、綠＝推廣、紅＝外借） */
:root{
  --bg:#0d1322; --surface:#151d2f; --surface2:#1b2539; --ink:#e7ebf3; --muted:#b9c2d6; --line:#4a5a82; --line2:#36435f;
  --accent:#f1ab40; --on-accent:#1a1406; --today:#232b40;
  --edu:#7fe0a8; --edu-bg:#163a25; --edu-bd:#4fae78;
  --rent:#ffa29d; --rent-bg:#45202a; --rent-bd:#c95a63;
  --danger:#ff8a80; --live:#ff5a4f; --scrim:rgba(3,6,14,.7);
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;max-width:1600px;margin:0 auto;display:grid;gap:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 頁首 */
.brandrow{display:flex;gap:14px;align-items:center}
.logo{width:84px;height:62px;flex:none;background:#f5f6f9;border-radius:12px;display:grid;place-items:center;padding:6px 8px}
.logo img{width:100%;height:auto;display:block}
.top{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:center;justify-content:space-between}
.brand .eyebrow{font-size:13px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(21px,2.6vw,27px);margin:0;letter-spacing:.04em}
.now{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.now .val{font-weight:500}
.clock{font-family:var(--f-data);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.who{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}

/* 分頁列 */
.nav{display:flex;gap:2px;border-bottom:2px solid var(--accent);overflow-x:auto}
.nav button{border:0;background:none;padding:9px 16px 8px;font-weight:500;color:var(--muted);border-radius:6px 6px 0 0;white-space:nowrap;display:flex;gap:6px;align-items:center}
.nav button:hover{color:var(--ink);background:var(--line2)}
.nav button[aria-current="page"]{background:var(--accent);color:var(--on-accent);font-weight:700}
.lock{font-size:12px;border:1px solid currentColor;border-radius:3px;padding:0 4px;opacity:.7}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:13px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.range{font-family:var(--f-data);font-size:15px;font-variant-numeric:tabular-nums;margin-left:4px}
.range b{font-family:var(--f-body);font-size:13px;color:var(--accent)}
.pills{display:flex;gap:4px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:3px 11px;font-size:13px}
.pills button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:500}
.legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px}
.sw{width:13px;height:13px;border-radius:3px;border:1px solid;display:inline-block}
.sw.edu{background:var(--edu-bg);border-color:var(--edu)}
.sw.rent{background:var(--rent-bg);border-color:var(--rent)}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--live);display:inline-block;flex:none}
.notice{border:1px dashed var(--line);border-radius:6px;padding:7px 12px;font-size:13.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* 週課表 */
.gridbox{overflow:auto;max-height:calc(100vh - 220px);min-height:320px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:1120px;table-layout:fixed}
.grid th,.grid td{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);vertical-align:top}
.grid thead th{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:2px solid var(--line);padding:7px 8px;text-align:left;font-weight:500}
.grid thead th .d{font-family:var(--f-data);font-size:13px;color:var(--muted);margin-left:6px}
.grid thead th .w{font-size:14.5px;font-weight:700}
.grid th.room{position:sticky;left:0;z-index:1;background:var(--surface);width:132px;padding:8px 10px;text-align:left;border-right:2px solid var(--line)}
.grid thead th.room{z-index:3;font-size:13px;color:var(--muted)}
.grid .rn{font-weight:700;font-size:14.5px}
.grid .rc{font-size:13px;color:var(--muted)}
.grid td{padding:4px;height:62px}
.grid td.is-today,.grid thead th.is-today{background:var(--today)}
.grid tbody th.room{background:var(--surface2)}
.grid thead th.is-today{box-shadow:inset 0 3px 0 var(--accent)}
.grid td.is-today{box-shadow:inset 1px 0 0 var(--accent),inset -1px 0 0 var(--accent)}
.grid thead th.is-today .w{color:var(--accent)}
td.addable{cursor:copy}
td.addable:hover{outline:1px dashed var(--accent);outline-offset:-3px}
.cell{display:grid;gap:4px}
.blk{border:1px solid;border-radius:5px;padding:4px 7px;text-align:left;width:100%;display:grid;gap:0}
.blk.edu{background:var(--edu-bg);border-color:var(--edu-bd)}
.blk.rent{background:var(--rent-bg);border-color:var(--rent-bd)}
.blk .t{font-family:var(--f-data);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.blk.edu .t{color:var(--edu)} .blk.rent .t{color:var(--rent)}
.blk .n{font-weight:700;font-size:14px;line-height:1.3}
.blk .m{font-size:12px;color:var(--ink);opacity:.82}
.blk .m .num{font-family:var(--f-data);white-space:nowrap}
.blk.live{box-shadow:0 0 0 2px var(--live)}
@media (prefers-reduced-motion:no-preference){.live .livedot{animation:pulse 1.6s infinite}}
@keyframes pulse{50%{opacity:.25}}

/* 今日課程 */
.today-list{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:4px;text-align:left;width:100%}
.tcard .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tcard .time{font-family:var(--f-data);font-size:15px;font-weight:500}
.tcard .nm{font-weight:700;font-size:15px}
.tcard .sub{font-size:13.5px;color:var(--muted)}
.tcard.done{opacity:.55}
.tcard.live{border-color:var(--live);box-shadow:0 0 0 1px var(--live)}
.status{font-size:13px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.status.live{color:var(--live);border-color:var(--live)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}

/* 管理頁 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;min-width:0}
.panel h2{margin:0;font-size:16px}
.tblbox{overflow-x:auto}
table.list{border-collapse:collapse;width:100%;min-width:760px}
.list th{font-size:13px;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.list td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:middle}
.list td.num{font-family:var(--f-data);font-size:13px;white-space:nowrap}
.list .nm{font-weight:700}
.list .ops{display:flex;gap:4px;justify-content:flex-end}
.tag{display:inline-block;font-size:13px;padding:0 8px;border-radius:10px;border:1px solid;white-space:nowrap}
.tag.edu{color:var(--edu);border-color:var(--edu-bd);background:var(--edu-bg)}
.tag.rent{color:var(--rent);border-color:var(--rent-bd);background:var(--rent-bg)}
.search{border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--surface);width:min(280px,100%)}
.list input{border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:var(--bg);width:100%;min-width:0}
.list input.cap{width:90px}
.hint{font-size:13.5px;color:var(--muted);margin:0}
.err{color:var(--danger);font-size:14px;white-space:pre-line}
.err:empty{display:none}

/* 登入閘門 */
.gate{max-width:380px;margin:24px auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:grid;gap:12px}
.gate h2{margin:0;font-family:var(--f-display);font-size:20px}

/* 表單 */
.f{display:grid;gap:4px}
.f label,.f .lab{font-size:13px;color:var(--muted)}
.f input,.f select{border:1px solid var(--line);border-radius:5px;padding:7px 9px;background:var(--surface2);width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:5px;padding:5px 9px;font-size:13px;color:var(--ink);cursor:pointer;background:var(--bg)}
.seg input{width:auto;accent-color:var(--accent);margin:0}
.seg.wd label{min-width:40px;justify-content:center}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* 彈窗 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.modal{position:fixed;z-index:31;left:50%;top:50%;transform:translate(-50%,-50%);width:min(480px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:12px}
.modal h3{margin:0;font-family:var(--f-display);font-size:19px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:6px 10px;margin:0}
.kv dt{color:var(--muted);font-size:13px;padding-top:2px}
.kv dd{margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;z-index:40;font-size:13px}
@media (max-width:600px){.clock{font-size:18px}.row2{grid-template-columns:1fr}}

/* 列印設定視窗 */
.modal.wide{width:min(720px,calc(100% - 32px))}
.roompick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.roompick label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--surface2);cursor:pointer}
.roompick label:has(input:checked){border-color:var(--accent)}
.roompick input{accent-color:var(--accent);margin:0}
.roompick .cnt{margin-left:auto;font-family:var(--f-data);font-size:12.5px;color:var(--muted)}
.roompick .cnt.has{color:var(--accent)}
.opt{display:flex;gap:8px;align-items:center;font-size:14px}
.opt input{accent-color:var(--accent)}
/* 列印預覽：紙張固定為白底，模擬實際輸出 */
#prPreview{position:fixed;inset:0;z-index:35;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.pv-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 auto 12px;max-width:297mm}
.pv-bar .hint{flex:1;min-width:200px}
.sheet{--p-ink:#111;--p-mute:#444;--p-line:#888;--p-line2:#bbb;--p-edu:#e3f3e8;--p-edu-bd:#2f8a55;--p-rent:#fbe3e4;--p-rent-bd:#b8434b;
  background:#fff;color:var(--p-ink);width:297mm;min-height:210mm;margin:0 auto;padding:8mm;box-shadow:0 4px 24px rgba(0,0,0,.5);font-family:var(--f-body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet,.sheet *{color:var(--p-ink)!important}
.sheet .t1,.sheet .rt,.sheet .rt *:not(.wk),.sheet small,.sheet .mt,.sheet .ft,.sheet .ft *{color:var(--p-mute)!important}
.sheet .mt{white-space:nowrap}
.sheet .sh{display:flex;align-items:center;gap:10px;border-bottom:1.5px solid var(--p-ink);padding-bottom:5px;margin-bottom:6px}
.sheet .sh img{height:13mm;width:auto}
.sheet .sh .tt{flex:1}
.sheet .sh .t1{font-size:9pt;color:var(--p-mute)}
.sheet .sh .t2{font-family:var(--f-display);font-weight:900;font-size:16pt;line-height:1.2}
.sheet .sh .rt{text-align:right;font-size:9pt;color:var(--p-mute);display:grid;gap:2px}
.sheet .sh .wk{font-size:12pt;font-weight:700;color:var(--p-ink);font-family:var(--f-data)}
.sheet .lg{display:flex;gap:10px;justify-content:flex-end;align-items:center}
.sheet .lg i{display:inline-block;width:9px;height:9px;border:1px solid;vertical-align:-1px;margin-right:3px}
.sheet table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:8pt}
.sheet th,.sheet td{border:0.6pt solid var(--p-line);padding:2px 3px;vertical-align:top;text-align:left}
.sheet thead th{background:#eef0f4;font-size:9pt;text-align:center}
.sheet thead th.rm{width:27mm}
.sheet tbody th{font-size:9pt;background:#f6f7f9}
.sheet tbody th small{display:block;font-weight:400;color:var(--p-mute);font-size:7.5pt}
.sheet tr{break-inside:avoid;page-break-inside:avoid}
.sheet td{height:11mm}
.sheet .pb{border:0.6pt solid;border-radius:2px;padding:1px 3px;margin-bottom:2px;line-height:1.25}
.sheet .pb:last-child{margin-bottom:0}
.sheet .pb.edu{background:var(--p-edu);border-color:var(--p-edu-bd)}
.sheet .pb.rent{background:var(--p-rent);border-color:var(--p-rent-bd)}
.sheet .pb b{display:block;font-size:8.5pt}
.sheet .pb .tm{font-family:var(--f-data);font-weight:500}
.sheet .pb .mt{color:var(--p-mute);font-size:7pt}
.sheet .ft{margin-top:4px;font-size:7.5pt;color:var(--p-mute);display:flex;justify-content:space-between}
/* 紙張內所有文字強制深色，不受深色主題或瀏覽器預設樣式影響 */
#sheet,#sheet *{color:#111!important}
#sheet .t1,#sheet .mt,#sheet small,#sheet .ft,#sheet .ft *{color:#3d3d3d!important}
#sheet .pb.edu .tm{color:#1d6b3f!important}
#sheet .pb.rent .tm{color:#9a2f37!important}
@page{size:A4 landscape;margin:0}
@media print{
  html,body{background:#fff!important;padding:0!important}
  :root{padding:0!important}
  .wrap,.scrim,.modal,.toast,.pv-bar{display:none!important}
  #prPreview{display:block!important;position:static;padding:0;overflow:visible;background:#fff}
  .sheet{box-shadow:none;margin:0;min-height:0}
}

/* ===== 電視看板模式（以 16:9 橫式設計，字級隨畫面寬度縮放） ===== */
#tv{position:fixed;inset:0;z-index:50;background:var(--bg);color:var(--ink);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;cursor:none;
  padding:calc(1.6vh + env(safe-area-inset-top,0px)) max(2.2vw,env(safe-area-inset-right,0px)) calc(1.2vh + env(safe-area-inset-bottom,0px)) max(2.2vw,env(safe-area-inset-left,0px));transition:filter 2s}
#tv.awake{cursor:default}
#tv.night{filter:brightness(.55)}
#tv .tv-inner{display:contents}
.tv-head{display:flex;align-items:center;gap:1.4vw;border-bottom:.35vh solid var(--accent);padding-bottom:1.4vh}
.tv-head .logo{width:6.6vw;height:4.6vw;border-radius:.8vw;padding:.5vw}
.tv-head .ttl{flex:1;min-width:0}
.tv-head .t1{font-size:1.15vw;color:var(--muted);letter-spacing:.12em}
.tv-head .t2{font-family:var(--f-display);font-weight:900;font-size:3vw;line-height:1.15;letter-spacing:.05em}
.tv-head .t2 em{font-style:normal;color:var(--accent)}
.tv-time{text-align:right}
.tv-time .d{font-size:1.5vw;font-weight:500}
.tv-time .c{font-family:var(--f-data);font-size:4.6vw;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.tv-body{position:relative;min-height:0;display:grid;grid-template-rows:auto 1fr;padding-top:1.2vh}
.tv-cols{display:grid;grid-template-columns:19% 45% 36%;font-size:1.15vw;color:var(--muted);letter-spacing:.14em;padding:0 0 .8vh}
.tv-cols span{padding-left:1vw}
.tv-rows{display:grid;align-content:start;gap:.9vh;min-height:0}
.tv-row{display:grid;grid-template-columns:19% 45% 36%;height:var(--tv-row,14vh);background:var(--surface);border:1px solid var(--line);border-radius:.6vw;overflow:hidden}
.tv-row>div{padding:.9vh 1vw;display:flex;flex-direction:column;justify-content:center;min-width:0;border-right:1px solid var(--line)}
.tv-row>div:last-child{border-right:0}
.tv-room .n{font-weight:700;font-size:2.3vw;line-height:1.1}
.tv-room .s{font-size:1.1vw;color:var(--muted)}
.tv-now.edu{background:var(--edu-bg);box-shadow:inset .4vw 0 0 var(--edu)}
.tv-now.rent{background:var(--rent-bg);box-shadow:inset .4vw 0 0 var(--rent)}
.tv-now .top{display:flex;align-items:center;gap:.7vw;font-family:var(--f-data);font-size:1.45vw;font-weight:500}
.tv-now.edu .top{color:var(--edu)} .tv-now.rent .top{color:var(--rent)}
.tv-now .top .left{margin-left:auto;font-family:var(--f-body);font-size:1.3vw;color:var(--ink);background:rgba(0,0,0,.25);padding:.1vh .7vw;border-radius:2vw}
.tv-now .nm{font-weight:700;font-size:2.2vw;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-now .who,.tv-next .who{font-size:1.2vw;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-now .livedot{width:1vw;height:1vw}
.tv-idle{font-size:1.5vw;color:var(--muted)}
.tv-next .top{display:flex;gap:.8vw;align-items:baseline}
.tv-next .tm{font-family:var(--f-data);font-size:1.6vw;font-weight:500}
.tv-next .in{font-size:1.15vw;color:var(--accent)}
.tv-next .nm{font-weight:700;font-size:1.75vw;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tv-next .typ{display:inline-block;width:.8vw;height:.8vw;border-radius:.15vw;margin-right:.5vw;vertical-align:.15vw}
.tv-next .typ.edu{background:var(--edu)} .tv-next .typ.rent{background:var(--rent)}
.tv-done{display:grid;place-content:center;text-align:center;gap:2vh;height:100%}
.tv-done .big{font-family:var(--f-display);font-weight:900;font-size:3.6vw}
.tv-done .sub{font-size:1.5vw;color:var(--muted)}
.tv-done ul{list-style:none;margin:0 auto;padding:0;display:grid;gap:.8vh;text-align:left;font-size:1.55vw;min-width:50vw}
.tv-done li{display:grid;grid-template-columns:13vw 14vw 1fr;gap:1vw;padding:.8vh 1.2vw;background:var(--surface);border:1px solid var(--line);border-radius:.5vw}
.tv-done li .tm{font-family:var(--f-data)}
.tv-foot{display:flex;align-items:center;gap:1.5vw;padding-top:1.1vh;font-size:1.2vw}
.tv-foot .legend{font-size:1.2vw;gap:1.2vw}
.tv-foot .legend .sw{width:1.1vw;height:1.1vw}
.tv-ticker{flex:1;min-width:0;overflow:hidden;white-space:nowrap;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 1vw;color:var(--accent);font-weight:500}
.tv-ticker span{display:inline-block;padding-left:100%}
@media (prefers-reduced-motion:no-preference){.tv-ticker span{animation:tick 28s linear infinite}}
@keyframes tick{to{transform:translateX(-100%)}}
.tv-page{font-family:var(--f-data);display:flex;gap:.6vw;align-items:center}
.tv-page i{display:block;width:.9vw;height:.9vw;border-radius:50%;border:1px solid var(--muted)}
.tv-page i.on{background:var(--accent);border-color:var(--accent)}
.tv-net{color:var(--muted);font-size:1.05vw}
.tv-net.bad{color:var(--live);font-weight:700}
.tv-prog{position:absolute;left:0;bottom:0;height:.35vh;background:var(--accent);width:0}
@media (prefers-reduced-motion:no-preference){.tv-prog.run{animation:prog var(--tv-dur,12s) linear forwards}}
@keyframes prog{to{width:100%}}
/* 看板控制列：移動滑鼠才出現 */
.tv-ctl{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));z-index:51;display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;opacity:0;transition:opacity .3s;pointer-events:none;font-size:13px}
#tv.awake .tv-ctl{opacity:1;pointer-events:auto}
.tv-ctl select{border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--surface2)}
</style>

<script src="firebase-config.js"></script>
<script>
/* ===== Firebase 設定：部署時填入；留空則為示範模式（資料存本機瀏覽器） ===== */
/* 設定放在同目錄的 firebase-config.js（window.FIREBASE_CONFIG）；找不到時為示範模式 */
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || { apiKey:"", authDomain:"", databaseURL:"", projectId:"", appId:"" };
const DB_ROOT = "ziqiang-schedule";
const FB_VER = "10.12.2";

/* ===== 工具 ===== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const wdOf = d => ((d.getDay()+6)%7)+1;            // 1=一 … 7=日
const mondayOf = d => addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()), -(wdOf(d)-1));
const WD = ["","一","二","三","四","五","六","日"];
const md = s => s.slice(5).replace("-","/");
const slash = s => s.replaceAll("-","/");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const nowHM = () => { const d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };
const floorOf = name => { const m = String(name).match(/B\d|\d(?=\d{2})/i); return m ? m[0].toUpperCase() : "其他"; };
const floorLabel = f => /^B/.test(f) ? f : (f==="其他" ? f : f+"F");
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
function armDelete(btn,fn){
  if(btn.dataset.armed){ fn(); return; }
  btn.dataset.armed="1"; const t=btn.textContent; btn.textContent="確認刪除？"; btn.classList.add("danger");
  setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.textContent=t; btn.classList.remove("danger"); } },3000);
}

/* ===== 預設資料 ===== */
const SEED_ROOMS = [
  ["自強B1 韻律教室",null,"韻律教室"],["自強B1 多功能教室",null,"多功能教室"],
  ["自強301",null,"烹飪教室"],["自強302",46,""],["自強303",42,""],["自強304",42,""],["自強305",40,""],
  ["自強401",28,""],["自強402",36,""],["自強403",40,""],["自強404",40,""],["自強405",68,""],["自強406",66,""],
  ["自強503",30,""],["自強601",137,"階梯教室"]
];
function seedRooms(){ const o={}; SEED_ROOMS.forEach(([name,cap,note],i)=>{ const id="r"+pad(i+1); o[id]={id,name,cap,note,order:i}; }); return o; }
function seedCourses(rooms){
  const byName = n => Object.values(rooms).find(r=>r.name===n)?.id;
  const list = [
    ["日語初級會話","林老師","自強405","edu","2026-09-14","2026-12-23",[1,3],"19:00","21:00"],
    ["Python 資料分析實務","張老師","自強402","edu","2026-09-08","2026-12-29",[2],"19:00","22:00"],
    ["商務英文寫作","Ms. Chen","自強403","edu","2026-09-10","2026-12-17",[4],"19:00","21:00"],
    ["中餐烹調丙級證照班","陳老師","自強301","edu","2026-09-05","2026-11-28",[6],"09:00","12:00"],
    ["西點烘焙入門","黃老師","自強301","edu","2026-09-05","2026-11-28",[6],"13:30","16:30"],
    ["瑜珈伸展","吳老師","自強B1 韻律教室","edu","2026-09-01","2026-12-31",[2,4],"18:30","20:00"],
    ["書法研習","許老師","自強404","edu","2026-09-04","2026-12-25",[5],"14:00","16:00"],
    ["攝影構圖入門","李老師","自強404","edu","2026-09-04","2026-12-25",[5],"19:00","21:00"],
    ["不動產經紀人考照班","周老師","自強601","edu","2026-09-06","2026-12-27",[7],"09:00","17:00"],
    ["外借：民間團體會員研習","承辦人 王先生","自強406","rent","2026-10-17","2026-10-18",[6,7],"09:00","17:00"],
    ["外借：證照考試試場","承辦人 劉小姐","自強302","rent","2026-10-18","2026-10-18",[7],"08:00","17:30"],
    ["外借：企業新進人員訓練","承辦人 蔡小姐","自強B1 多功能教室","rent","2026-10-12","2026-10-16",[1,2,3,4,5],"09:00","16:00"],
  ];
  const o={}; list.forEach(([name,teacher,room,type,sd,ed,wd,st,et])=>{ const id=uid(); o[id]={id,name,teacher,roomId:byName(room),type,startDate:sd,endDate:ed,weekdays:wd,startTime:st,endTime:et}; }); return o;
}

/* ===== 狀態與資料層 ===== */
const S = { mode:"demo", rooms:{}, courses:{}, user:null, week:mondayOf(new Date()), page:"week", floor:"all", ctype:"all" };
const LS_KEY = "ziqiang-schedule-demo-v1";
let fb = null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({rooms:S.rooms,courses:S.courses})); }catch(e){} }

async function initStore(){
  if (FIREBASE_CONFIG.apiKey){
    try{
      const base=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
      await loadScript(base+"firebase-app-compat.js");
      await Promise.all([loadScript(base+"firebase-auth-compat.js"), loadScript(base+"firebase-database-compat.js")]);
      firebase.initializeApp(FIREBASE_CONFIG);
      fb = { db: firebase.database(), auth: firebase.auth() };
      S.mode = "firebase";
      let roomsLoaded=false;
      const seedIfEmpty=()=>{ if(S.user&&roomsLoaded&&!Object.keys(S.rooms).length) fb.db.ref(DB_ROOT+"/rooms").set(seedRooms()); };
      fb.auth.onAuthStateChanged(u => { S.user = u ? (u.email||"管理者") : null; renderAuth(); render(); seedIfEmpty(); });
      fb.db.ref(DB_ROOT+"/rooms").on("value", snap => { roomsLoaded=true; S.rooms = snap.val() || {}; render(); seedIfEmpty(); });
      fb.db.ref(DB_ROOT+"/courses").on("value", snap => { S.courses = snap.val() || {}; TV.lastSync=new Date(); render(); });
      fb.db.ref(".info/connected").on("value", snap => { TV.online = !!snap.val(); if(TV.online) TV.lastSync=new Date(); if(TV.on) renderTV(false); });
      fb.db.ref(DB_ROOT+"/notice").on("value", snap => { TV.notice = snap.val() || ""; if(TV.on) renderTV(false); });
      return;
    }catch(e){ console.error(e); toast("無法連線 Firebase，改用示範模式"); }
  }
  S.mode = "demo";
  let stored=null; try{ stored = JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(e){}
  if (stored && stored.rooms){ S.rooms=stored.rooms; S.courses=stored.courses||{}; }
  else { S.rooms=seedRooms(); S.courses=seedCourses(S.rooms); saveLocal(); }
  $("#demoNote").hidden = false;
  render();
}
async function put(kind,obj){
  if (S.mode==="firebase") return fb.db.ref(`${DB_ROOT}/${kind}/${obj.id}`).set(obj);
  S[kind][obj.id]=obj; saveLocal(); render();
}
async function del(kind,id){
  if (S.mode==="firebase") return fb.db.ref(`${DB_ROOT}/${kind}/${id}`).remove();
  delete S[kind][id]; saveLocal(); render();
}
const roomsSorted = () => Object.values(S.rooms).sort((a,b)=>(a.order??0)-(b.order??0));
const occursOn = (c,ds) => c.startDate<=ds && ds<=c.endDate && (c.weekdays||[]).includes(wdOf(parse(ds)));
const roomName = id => S.rooms[id]?.name || "（教室已刪除）";

/* ===== 分頁 ===== */
const LOCKED = ["courses","rooms"];
function go(page){
  S.page = page;
  $$(".nav button").forEach(b=>{ if(b.dataset.page===page) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  const needGate = LOCKED.includes(page) && !S.user;
  ["week","today","courses","rooms"].forEach(p=>$("#page-"+p).hidden = p!==page || needGate);
  $("#page-gate").hidden = !needGate;
  if(needGate){ $("#lgErr").textContent=""; $("#loginHint").textContent = S.mode==="demo" ? "示範模式：尚未連接 Firebase，輸入任意 Email 與密碼即可進入。" : "請使用管理者提供的帳號密碼。"; }
  try{ history.replaceState(null,"","#"+page); }catch(e){}
  render();
}
$$(".nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));

function render(){
  if(TV.on) renderTV(false);
  if(S.page==="week") renderWeek();
  else if(S.page==="today") renderToday();
  else if(S.user && S.page==="courses") renderCourses();
  else if(S.user && S.page==="rooms") renderRooms();
}

/* ===== 頁首 ===== */
function renderHeader(){
  const d=new Date();
  $("#today").textContent=`${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}（${WD[wdOf(d)]}）民國${d.getFullYear()-1911}年`;
  $("#clock").textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function renderAuth(){
  $("#who").hidden = !S.user; $("#whoName").textContent = S.user||"";
  $$("[data-lock]").forEach(l=>l.hidden=!!S.user);
  if(LOCKED.includes(S.page)) go(S.page);
}

/* ===== 週課表 ===== */
function renderFloorPills(){
  const floors=[...new Set(roomsSorted().map(r=>floorOf(r.name)))];
  if(S.floor!=="all" && !floors.includes(S.floor)) S.floor="all";
  $("#floorPills").innerHTML=[["all","全部樓層"],...floors.map(f=>[f,floorLabel(f)])].map(([v,l])=>`<button data-floor="${v}" aria-pressed="${S.floor===v}">${l}</button>`).join("");
}
$("#floorPills").onclick=e=>{ const b=e.target.closest("[data-floor]"); if(b){ S.floor=b.dataset.floor; renderWeek(); } };

function renderWeek(){
  renderFloorPills();
  const days=[...Array(7)].map((_,i)=>addDays(S.week,i));
  const todayS=ymd(new Date()), hm=nowHM();
  const rooms=roomsSorted().filter(r=>S.floor==="all"||floorOf(r.name)===S.floor);
  const courses=Object.values(S.courses);
  let edu=0, rent=0;
  let h=`<thead><tr><th class="room">教室</th>`;
  days.forEach(d=>{ const t=ymd(d)===todayS; h+=`<th class="${t?"is-today":""}"><span class="w">週${WD[wdOf(d)]}</span><span class="d">${md(ymd(d))}${t?" 今天":""}</span></th>`; });
  h+=`</tr></thead><tbody>`;
  if(!rooms.length) h+=`<tr><td colspan="8" style="padding:24px;color:var(--muted)">尚未設定教室，請到「教室管理」新增。</td></tr>`;
  rooms.forEach(r=>{
    h+=`<tr><th class="room" scope="row"><div class="rn">${esc(r.name)}</div><div class="rc">${r.cap?`${r.cap} 人`:""}${r.cap&&r.note?" · ":""}${esc(r.note||"")}</div></th>`;
    days.forEach(d=>{
      const ds=ymd(d), isT=ds===todayS;
      const list=courses.filter(c=>c.roomId===r.id&&occursOn(c,ds)).sort((a,b)=>a.startTime.localeCompare(b.startTime));
      list.forEach(c=>c.type==="rent"?rent++:edu++);
      const cls=[isT?"is-today":"", S.user?"addable":""].join(" ").trim();
      h+=`<td class="${cls}" data-room="${r.id}" data-date="${ds}"${S.user?' title="點空白處新增課程"':""}><div class="cell">`;
      list.forEach(c=>{
        const live=isT&&c.startTime<=hm&&hm<c.endTime;
        h+=`<button class="blk ${c.type==="rent"?"rent":"edu"}${live?" live":""}" data-id="${c.id}">
          <span class="t">${live?'<span class="livedot"></span>':""}${c.startTime}–${c.endTime}</span>
          <span class="n">${esc(c.name)}</span>
          <span class="m">${esc(c.teacher||"")}${c.teacher?" · ":""}<span class="num">${md(c.startDate)}–${md(c.endDate)}</span></span>
        </button>`;
      });
      h+=`</div></td>`;
    });
    h+=`</tr>`;
  });
  $("#grid").innerHTML=h+`</tbody>`;

function findConflicts(c){
  return Object.values(S.courses).filter(o=>{
    if(o.id===c.id||o.roomId!==c.roomId) return false;
    if(!(o.startTime<c.endTime&&c.startTime<o.endTime)) return false;
    const s=o.startDate>c.startDate?o.startDate:c.startDate, e=o.endDate<c.endDate?o.endDate:c.endDate;
    if(s>e) return false;
    for(let d=parse(s),n=0; ymd(d)<=e && n<800; d=addDays(d,1),n++){ const w=wdOf(d); if(o.weekdays.includes(w)&&c.weekdays.includes(w)) return true; }
    return false;
  });
}

$("#tvFloor").onchange=e=>{ TV.floor=e.target.value; TV.page=0; renderTV(true); };
let tvWake=null;
$("#tv").addEventListener("mousemove",()=>{ $("#tv").classList.add("awake"); clearTimeout(tvWake); tvWake=setTimeout(()=>$("#tv").classList.remove("awake"),3000); });
document.addEventListener("keydown",e=>{ if(TV.on&&e.key==="Escape") exitTV(); });

function renderTVClock(){
  const d=tvNow();
  $("#tvDate").textContent=`${d.getFullYear()-1911}年${d.getMonth()+1}月${d.getDate()}日（${WD[wdOf(d)]}）`;
  $("#tvClock").textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}`;
  $("#tv").classList.toggle("night", d.getHours()>=22||d.getHours()<7);
}
function renderTV(newPage){
  if(!TV.on) return;
  renderTVClock();
  const d=tvNow(), ds=ymd(d), hm=pad(d.getHours())+":"+pad(d.getMinutes()), nowM=mins(hm);
  $("#tvScope").textContent = TV.floor==="all" ? "今日課程" : `${floorLabel(TV.floor)} 今日課程`;
  const rooms=roomsSorted().filter(r=>TV.floor==="all"||floorOf(r.name)===TV.floor);
  const rows=[];
  rooms.forEach(r=>{
    const list=Object.values(S.courses).filter(c=>c.roomId===r.id&&occursOn(c,ds)).sort((a,b)=>a.startTime.localeCompare(b.startTime));
    const cur=list.find(c=>c.startTime<=hm&&hm<c.endTime), nxt=list.find(c=>c.startTime>hm);
    if(cur||nxt) rows.push({r,cur,nxt});
  });
  const rowsEl=$("#tvRows");
  if(!rows.length){
    $("#tvCols").style.visibility="hidden";
    const tm=addDays(d,1), ts=ymd(tm);
    const tl=Object.values(S.courses).filter(c=>occursOn(c,ts)&&rooms.some(r=>r.id===c.roomId)).sort((a,b)=>a.startTime.localeCompare(b.startTime)).slice(0,7);
    rowsEl.innerHTML=`<div class="tv-done"><div class="big">${nowM<12*60&&Object.values(S.courses).some(c=>occursOn(c,ds))?"今日課程尚未開始":"今日課程皆已結束"}</div>
      <div class="sub">明日 ${tm.getMonth()+1}/${tm.getDate()}（${WD[wdOf(tm)]}）課程預告</div>
      ${tl.length?`<ul>${tl.map(c=>`<li><span class="tm">${c.startTime}–${c.endTime}</span><span>${esc(roomName(c.roomId))}</span><b>${esc(c.name)}</b></li>`).join("")}</ul>`:`<div class="sub">明日無排定課程</div>`}</div>`;
    TV.pages=1; $("#tvPage").innerHTML=""; $("#tvProg").classList.remove("run");
  } else {
    $("#tvCols").style.visibility="";
    const avail=rowsEl.getBoundingClientRect().height || innerHeight*0.62;
    const per=Math.max(1,Math.floor((avail+innerHeight*0.009)/(innerHeight*0.14+innerHeight*0.009)));
    TV.pages=Math.ceil(rows.length/per); if(TV.page>=TV.pages) TV.page=0;
    const show=rows.slice(TV.page*per,(TV.page+1)*per);
    const who=c=>c.teacher?esc(c.teacher):"";
    rowsEl.innerHTML=show.map(({r,cur,nxt})=>{
      const nowCell = cur ? `<div class="tv-now ${cur.type}">
          <div class="top"><span class="livedot"></span>${cur.startTime}–${cur.endTime}<span class="left">還有 ${fmtLeft(mins(cur.endTime)-nowM)}</span></div>
          <div class="nm">${esc(cur.name)}</div><div class="who">${who(cur)}</div></div>`
        : `<div class="tv-now"><span class="tv-idle">目前無課程</span></div>`;
      const nextCell = nxt ? `<div class="tv-next">
          <div class="top"><span class="tm">${nxt.startTime}–${nxt.endTime}</span><span class="in">${fmtLeft(mins(nxt.startTime)-nowM)}後開始</span></div>
          <div class="nm"><span class="typ ${nxt.type}"></span>${esc(nxt.name)}</div><div class="who">${who(nxt)}</div></div>`
        : `<div class="tv-next"><span class="tv-idle">今日無後續課程</span></div>`;
      return `<div class="tv-row"><div class="tv-room"><div class="n">${esc(r.name)}</div><div class="s">${r.cap?r.cap+" 人":""}${r.cap&&r.note?" · ":""}${esc(r.note||"")}</div></div>${nowCell}${nextCell}</div>`;
    }).join("");
    $("#tvPage").innerHTML = TV.pages>1 ? [...Array(TV.pages)].map((_,i)=>`<i class="${i===TV.page?"on":""}"></i>`).join("")+`<span>${TV.page+1}/${TV.pages}</span>` : "";
    const pg=$("#tvProg");
    if(TV.pages>1 && newPage){ pg.classList.remove("run"); void pg.offsetWidth; pg.style.setProperty("--tv-dur",TV.dur+"ms"); pg.classList.add("run"); }
    if(TV.pages<=1) pg.classList.remove("run");
  }
  $("#tvTickerText").textContent=TV.notice; $("#tvTicker").hidden=!TV.notice;
  const net=$("#tvNet");
  if(S.mode==="demo"){ net.className="tv-net"; net.textContent="示範模式"; }
  else if(TV.online){ net.className="tv-net"; net.textContent="即時連線"; }
  else { net.className="tv-net bad"; net.textContent=`連線中斷・資料更新於 ${pad(TV.lastSync.getHours())}:${pad(TV.lastSync.getMinutes())}`; }
}
function fmtLeft(m){ if(m<60) return m+" 分"; const h=Math.floor(m/60), r=m%60; return r?`${h} 小時 ${r} 分`:`${h} 小時`; }
/* 每 10 分鐘微幅位移，避免烙印 */
setInterval(()=>{ if(TV.on){ const x=Math.round(Math.random()*6-3), y=Math.round(Math.random()*6-3); $("#tv").style.transform=`translate(${x}px,${y}px)`; } },600000);
/* 每天凌晨 3 點重新載入 */
setInterval(()=>{ const d=new Date(); if(TV.on&&d.getHours()===3&&d.getMinutes()===0&&d.getSeconds()<2) location.reload(); },1000);
addEventListener("resize",()=>{ if(TV.on) renderTV(false); });

/* ===== 啟動 ===== */
renderHeader();
setInterval(()=>{ renderHeader(); if(TV.on){ renderTVClock(); if(tvNow().getSeconds()===0) renderTV(false); } else if(new Date().getSeconds()===0 && (S.page==="week"||S.page==="today")) render(); },1000);
const startPage = (location.hash||"").slice(1);
go(["week","today","courses","rooms"].includes(startPage)?startPage:"week");
initStore().then(()=>{ const m=startPage.match(/^tv(?:-(B\d|\d)F?)?$/i); if(m) enterTV(m[1]?m[1].toUpperCase():"all"); });
</script>
